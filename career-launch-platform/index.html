<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Light / dark mode: set before anything is drawn so the page never flashes the wrong mode.
         Uses the visitor's saved choice, otherwise their device setting. See src/lib/useTheme.ts -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <title>Your Career Launch Platform – Practical Apprenticeships & Mentorship</title>
    <meta name="description" content="Turn your potential into practical skills. Structured 12-month apprenticeships and 3-to-6 month professional mentorships for university and college students." />

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
